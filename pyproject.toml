[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leslie-hale-astrology"
version = "0.1.0"
description = "Leslie Hale Astrology — Django + Wagtail site (not a distributed library; pyproject exists to pin the dependency set)."
requires-python = "==3.12.*"
dependencies = [
    # Framework
    # Same-branch patch bumps only (reviews/2026-09-22-final-security-review.md
    # finding 5): Django 5.1.4 -> 5.1.15, wagtail 6.3.1 -> 6.3.8, Pillow
    # 11.0.0 -> 11.3.0 — every advisory pip-audit reported at the old pins is
    # already fixed on the same branch already committed to; none of these is
    # a major/minor jump. Verified against PyPI's release/yanked metadata and
    # Wagtail 6.3.8's own requires_dist (Django<6.0,>=4.2) before bumping.
    "Django==5.1.15",
    "wagtail==6.3.8",
    "django-modelcluster==6.3",
    "django-taggit==6.1.0",
    # htmx integration
    "django-htmx==1.19.0",
    # Database
    "psycopg[binary]==3.2.3",
    "dj-database-url==2.3.0",
    # Static / media
    "whitenoise==6.7.0",
    "Pillow==11.3.0",
    # WSGI server
    "gunicorn==23.0.0",
    # Payments
    "stripe==15.6.1",
    # XML parsing (Blogger feed import) — hardened against XXE/entity expansion
    "defusedxml==0.7.1",
    # Rate limiting (reviews/2026-09-22-final-security-review.md finding 1) —
    # decorator library only, no INSTALLED_APPS entry and no models of its
    # own (verified against its PyPI long description). booking-payments and
    # the contact endpoints apply @ratelimit to their own views; this repo
    # only supplies the pinned dependency and the shared cache backend it
    # rate-limits against (config/settings/base.py CACHES).
    "django-ratelimit==4.1.0",
    # Admin login brute-force protection (finding 4). Chosen over reusing
    # django-ratelimit for this: django-ratelimit is a per-view decorator,
    # and neither Django's nor Wagtail's own admin login view is ours to
    # decorate from this repo's settings-only scope. django-axes hooks
    # AUTHENTICATION_BACKENDS/MIDDLEWARE instead, so it covers both
    # /django-admin/ and /admin/ (Wagtail's own login view still calls
    # Django's authenticate()) with a settings-only change.
    "django-axes==8.3.1",
]

# Test tooling — installed in the "dev" Dockerfile stage only (`pip install
# .[dev]`), never in the production "runtime" stage. A test framework is
# unnecessary attack surface in a production image. beautifulsoup4 is not
# listed here: wagtail==6.3.1 already pins it as an unconditional runtime
# dependency (beautifulsoup4<4.13,>=4.8, verified via the PyPI JSON API —
# not an extra, so it resolves transitively in every install of this
# project, dev or prod).
[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-django==4.9.0",
    "factory_boy==3.3.1",
    "freezegun==1.5.1",
    # tests/browser/ — real-Chromium Playwright suite (see that directory's
    # own conftest.py docstring and the root conftest.py collect_ignore
    # gating it behind LHA_RUN_BROWSER_TESTS). Verified against the PyPI
    # JSON API before pinning: playwright 1.48.0 is not yanked, ships
    # win/macOS/manylinux wheels, requires-python >=3.8 (fine under this
    # project's ==3.12.*), and pins its own greenlet==3.1.1/pyee==12.0.0.
    # pytest-playwright 0.5.2 is not yanked, requires-python >=3.8, and its
    # own requires_dist ("playwright>=1.18", "pytest<9.0.0,>=6.2.4") is
    # satisfied by both the playwright pin above and this project's existing
    # pytest==8.3.4. Neither package's pip install pulls the Chromium
    # binary itself — that is a separate `playwright install` step, see
    # docker/Dockerfile's "dev" stage.
    "playwright==1.48.0",
    "pytest-playwright==0.5.2",
]

# This project is app code, not a distributable library — there is no
# top-level importable package matching the project name, so we tell
# setuptools to ship metadata only. `pip install .` in docker/Dockerfile
# then does one thing: resolve and install the exact pinned dependency set
# above. The Dockerfile COPYs the actual source tree separately.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["versions", "migrations"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
